# Perfil de desenvolvimento local: H2 persistente em ./dados/nmb.
spring.datasource.url=jdbc:h2:file:./dados/nmb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


# Desenvolvimento usa exclusivamente o Asaas Sandbox. Configure chave Sandbox.
asaas.enabled=true
asaas.base-url=https://api-sandbox.asaas.com/v3
