<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Token CSRF: as mudanças de etapa só são aceitas quando vêm desta página -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <!-- CSS único do site: fontes, site.css e cores do painel (ver AGENTS.md) -->
    <th:block th:replace="~{fragments/css :: css}"></th:block>
    <title>Separação de pedidos</title>
    <link rel="icon" type="image/png" sizes="256x256" th:href="@{/brand/favicon.png(v=2)}">
</head>
<body class="admin-ui pg-adminSeparacao">
    <div class="barrabranca">
        <button th:replace="~{fragments/fragmentos :: botao-sidebar}"></button>
        <a th:replace="~{fragments/fragmentos :: logo}"></a>
    </div>

    <main class="sep" th:attr="data-ver-detalhe=${#authorization.expression('hasRole(''ADMIN'')')}">
        <header class="sep-topo">
            <div>
                <h1 class="adm-titulo">Separação de pedidos</h1>
                <p class="sep-ao-vivo"><span class="sep-ponto" id="ponto"></span> <span id="estadoSync">Conectando…</span></p>
            </div>
            <input type="search" id="busca" class="sep-busca" placeholder="Buscar por código ou cliente" aria-label="Buscar por código ou cliente" autocomplete="off">
        </header>

        <div class="sep-filtros" role="group" aria-label="Filtrar por etapa">
            <button type="button" class="sep-filtro ativo" data-filtro="TODOS">Todos <b data-cont="TODOS">0</b></button>
            <button type="button" class="sep-filtro" data-filtro="NOVOS">Novos <b data-cont="NOVOS">0</b></button>
            <button type="button" class="sep-filtro" data-filtro="EM_SEPARACAO">Em separação <b data-cont="EM_SEPARACAO">0</b></button>
            <button type="button" class="sep-filtro" data-filtro="SEPARADO">Separado <b data-cont="SEPARADO">0</b></button>
            <button type="button" class="sep-filtro" data-filtro="ENVIADO">Enviado <b data-cont="ENVIADO">0</b></button>
        </div>

        <div class="sep-quadro" id="quadro">
            <section class="sep-coluna" data-coluna="NOVOS"><h2><span class="status-pedido status-pedido-pago">Novos / Aguardando</span></h2><div class="sep-lista"></div></section>
            <section class="sep-coluna" data-coluna="EM_SEPARACAO"><h2><span class="status-pedido status-pedido-separacao">Em separação</span></h2><div class="sep-lista"></div></section>
            <section class="sep-coluna" data-coluna="SEPARADO"><h2><span class="status-pedido status-pedido-separado">Separado</span></h2><div class="sep-lista"></div></section>
            <section class="sep-coluna" data-coluna="ENVIADO"><h2><span class="status-pedido status-pedido-enviado">Enviado</span></h2><div class="sep-lista"></div></section>
        </div>
        <div class="sep-aviso" id="aviso" role="alert" hidden></div>
    </main>

    <div th:replace="~{fragments/fragmentos :: sidebar}"></div>
    <div class="overlay" id="overlay"></div>
    <script th:src="@{/jshome.js(v=11)}"></script>
    <script th:inline="javascript">
    (function () {
        var base = /*[[@{/admin/separacao}]]*/ '/admin/separacao';
        var detalheAdmin = /*[[@{/admin/pedidos/}]]*/ '/admin/pedidos/';
        var detalheSeparador = /*[[@{/admin/separacao/pedido/}]]*/ '/admin/separacao/pedido/';
        // ADMIN abre a ficha administrativa; SEPARADOR abre a conferência restrita à separação.
        var verDetalheAdmin = document.querySelector('main.sep').dataset.verDetalhe === 'true';
        var detalhe = verDetalheAdmin ? detalheAdmin : detalheSeparador;
        var csrfToken = document.querySelector('meta[name="_csrf"]').content;
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        var INTERVALO = 3000;
        var pedidos = [], conhecidos = null, filtro = 'TODOS', ocupado = {};
        var busca = document.getElementById('busca');
        var aviso = document.getElementById('aviso');
        // Arrays com espaço depois do "[": "[[" seria lido pelo Thymeleaf como expressão e quebraria a página
        var acoes = {
            NOVOS: [ ['EM_SEPARACAO', 'Iniciar separação', true] ],
            EM_SEPARACAO: [ ['PAGO', '← Voltar'], ['SEPARADO', 'Marcar separado', true] ],
            SEPARADO: [ ['EM_SEPARACAO', '← Voltar'], ['ENVIADO', 'Marcar enviado', true] ],
            ENVIADO: [ ['SEPARADO', '← Voltar'] ]
        };
        function coluna(s) { return (s === 'PAGO' || s === 'AGUARDANDO_PAGAMENTO') ? 'NOVOS' : s; }
        function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }

        function desenhar() {
            var termo = busca.value.trim().toLowerCase().replace(/-/g, '');
            var cont = { TODOS: 0, NOVOS: 0, EM_SEPARACAO: 0, SEPARADO: 0, ENVIADO: 0 };
            var html = { NOVOS: '', EM_SEPARACAO: '', SEPARADO: '', ENVIADO: '' };
            pedidos.forEach(function (p) {
                var c = coluna(p.status);
                if (!html.hasOwnProperty(c)) return;
                var texto = (p.codigo.replace(/-/g, '') + ' ' + p.cliente).toLowerCase();
                if (termo && texto.indexOf(termo) === -1) return;
                cont[c]++; cont.TODOS++;
                var botoes = acoes[c].map(function (a) {
                    return '<button type="button" class="sep-btn' + (a[2] ? ' sep-btn-principal' : '') + '" data-codigo="' + esc(p.codigo) + '" data-para="' + a[0] + '"' + (ocupado[p.codigo] ? ' disabled' : '') + '>' + a[1] + '</button>';
                }).join('');
                html[c] += '<article class="sep-cartao' + (p.novo ? ' sep-cartao-novo' : '') + '\">' +
                    '<div class="sep-cartao-topo"><a class="sep-codigo" href="' + detalhe + encodeURIComponent(p.codigo) + '\">' + esc(p.codigo) + '</a>' +
                    '<span class="status-pedido status-pedido-' + esc(p.statusClasse) + '\">' + esc(p.statusRotulo) + '</span></div>' +
                    '<p class="sep-cliente">' + esc(p.cliente) + '</p>' +
                    '<p class="sep-meta"><span>📍 ' + esc(p.destino || '—') + '</span><span>🕒 ' + esc(p.confirmadoEmTexto || '—') + '</span><span>' + p.itens + (p.itens === 1 ? ' item' : ' itens') + '</span></p>' +
                    '<div class="sep-acoes">' + botoes + '</div></article>';
            });
            document.querySelectorAll('.sep-coluna').forEach(function (col) {
                var k = col.dataset.coluna;
                col.querySelector('.sep-lista').innerHTML = html[k] || '<p class="sep-vazio">Nenhum pedido</p>';
                col.hidden = filtro !== 'TODOS' && filtro !== k;
            });
            document.getElementById('quadro').classList.toggle('sep-quadro-unico', filtro !== 'TODOS');
            Object.keys(cont).forEach(function (k) { document.querySelector('[data-cont="' + k + '"]').textContent = cont[k]; });
        }

        function sincronizar() {
            fetch(base + '/pedidos', { headers: { Accept: 'application/json' }, credentials: 'same-origin' })
                .then(function (r) { if (!r.ok) throw r; return r.json(); })
                .then(function (lista) {
                    var antes = conhecidos;
                    conhecidos = {};
                    lista.forEach(function (p) { conhecidos[p.codigo] = true; p.novo = antes !== null && !antes[p.codigo]; });
                    pedidos = lista;
                    desenhar();
                    document.getElementById('ponto').classList.add('ok');
                    document.getElementById('estadoSync').textContent = 'Ao vivo · atualizado às ' + new Date().toLocaleTimeString('pt-BR');
                })
                .catch(function () {
                    document.getElementById('ponto').classList.remove('ok');
                    document.getElementById('estadoSync').textContent = 'Sem conexão — tentando de novo…';
                });
        }

        document.getElementById('quadro').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-para]');
            if (!b) return;
            var codigo = b.dataset.codigo, para = b.dataset.para;
            ocupado[codigo] = true; desenhar();
            fetch(base + '/' + encodeURIComponent(codigo) + '/status', {
                method: 'POST', credentials: 'same-origin',
                headers: (function () {
                    var h = { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' };
                    h[csrfHeader] = csrfToken;
                    return h;
                })(),
                body: 'status=' + encodeURIComponent(para)
            }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw j; }); })
              .then(function () { aviso.hidden = true; })
              .catch(function (j) { aviso.textContent = (j && j.erro) || 'Não foi possível mudar a etapa.'; aviso.hidden = false; })
              .finally(function () { delete ocupado[codigo]; sincronizar(); });
        });
        document.querySelectorAll('.sep-filtro').forEach(function (f) {
            f.addEventListener('click', function () {
                document.querySelectorAll('.sep-filtro').forEach(function (x) { x.classList.remove('ativo'); });
                f.classList.add('ativo'); filtro = f.dataset.filtro; desenhar();
            });
        });
        busca.addEventListener('input', desenhar);
        sincronizar();
        setInterval(function () { if (!document.hidden) sincronizar(); }, INTERVALO);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) sincronizar(); });
    })();
    </script>
</body>
</html>
