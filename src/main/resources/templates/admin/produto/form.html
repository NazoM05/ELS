<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS único do site: fontes, site.css e cores do painel (ver AGENTS.md) -->
    <th:block th:replace="~{fragments/css :: css}"></th:block>

    <title th:replace="~{fragments/fragmentos :: titulo(${txt['pg.adminEditar.titulo']})}">Editar produto - Estilo London Store</title>
    <link rel="icon" type="image/png" sizes="256x256" th:href="@{/brand/favicon.png(v=2)}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico(v=2)}">
    <link rel="apple-touch-icon" th:href="@{/brand/apple-touch-icon.png(v=2)}">
</head>

<body class="admin-ui pg-adminEditar">

    <!-- Barra de anúncios -->

    <!-- Barra branca com menu -->
    <div class="barrabranca">
        <button th:replace="~{fragments/fragmentos :: botao-sidebar}"></button>
        <a th:replace="~{fragments/fragmentos :: logo}"></a>
    </div>

    <main class="cadastro-container">

        <a class="adm-voltar" th:href="@{/admin/produto/listar}">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            <th:block th:text="${txt['pg.adminEditar.voltar']}">Voltar para produtos</th:block>
        </a>

        <section class="cadastro-form-box">
            <h2 th:text="${txt['pg.adminEditar.h2']}">Editar produto</h2>

            <!-- Envia para AdminController: POST /admin/produto/salvar -->
            <form th:action="@{/admin/produto/salvar}" th:object="${produto}" method="post" enctype="multipart/form-data" class="cadastro-form">

                <!-- Campos preservados: sem o id o Spring criaria um produto novo -->
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imagemFrente}">
                <input type="hidden" th:field="*{imagemCostas}">
                <input type="hidden" th:field="*{imagemModelo}">
                <input type="hidden" th:field="*{imagemGuiaTamanhos}">

                <div class="cadastro-campo adm-c4">
                    <label for="nome">Nome do produto</label>
                    <input type="text" id="nome" th:field="*{nome}" maxlength="120" required>
                </div>

                <div class="cadastro-campo adm-c2">
                    <label for="preco">Preço</label>
                    <div class="adm-prefixo">
                        <span aria-hidden="true">R$</span>
                        <input type="number" id="preco" th:field="*{preco}" step="0.01" min="0" inputmode="decimal" required>
                    </div>
                </div>

                <div class="cadastro-campo adm-c3">
                    <label for="cor">Cor</label>
                    <input type="text" id="cor" th:field="*{cor}" maxlength="50">
                </div>

                <div class="cadastro-campo adm-c3">
                    <label for="tipo">Tipo</label>
                    <input type="text" id="tipo" th:field="*{tipo}">
                </div>

                <div th:replace="~{fragments/campos-produto :: categoria(${produto})}"></div>
                <div th:replace="~{fragments/campos-produto :: genero(${produto})}"></div>

                <div th:replace="~{fragments/campos-produto :: outlet(${produto})}"></div>
                <div th:replace="~{fragments/campos-produto :: descricao(${produto})}"></div>
                <div th:replace="~{fragments/campos-produto :: tamanhos(${produto})}"></div>

                <div class="cadastro-campo adm-c6">
                    <span class="adm-rotulo" id="rotuloStatus">Situação</span>
                    <div class="adm-chips" role="radiogroup" aria-labelledby="rotuloStatus">
                        <label class="adm-chip">
                            <input type="radio" th:field="*{status}" value="true">
                            <span>Ativo</span>
                        </label>
                        <label class="adm-chip">
                            <input type="radio" th:field="*{status}" value="false">
                            <span>Inativo</span>
                        </label>
                    </div>
                </div>

                <div th:replace="~{fragments/campos-produto :: imagens(${produto})}"></div>

                <div class="adm-acoes">
                    <a th:href="@{/admin/produto/listar}" class="adm-btn adm-btn-sec" th:text="${txt['pg.adminEditar.btnCancelar']}">Cancelar</a>
                    <button type="submit" class="btn-comprar cadastro-btn-salvar adm-btn" th:text="${txt['pg.adminEditar.btnSalvar']}">Salvar alterações</button>
                </div>
            </form>
        </section>
    </main>

   <div th:replace="~{fragments/fragmentos :: sidebar}" ></div>
    <div class="overlay" id="overlay"></div>

    <script th:src="@{/jshome.js(v=11)}"></script>
</body>
</html>
