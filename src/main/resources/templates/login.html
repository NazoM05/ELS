<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/berzerk.css(v=8)}">


    <title>Entrar | Estilo London Store</title>
    <link rel="icon" type="image/png" sizes="256x256" th:href="@{/brand/favicon.png}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/brand/apple-touch-icon.png}">
</head>

<body>

    <main class="login">

        <!-- Painel escuro com a marca -->
        <section class="login-marca">
            <img class="login-marca-fundo" th:src="@{/brand/logo-el-branca-hd.png}" alt="" aria-hidden="true">
            <a class="login-logo" th:href="@{/}">Estilo London</a>
            <h1 class="login-titulo">Acesse<br>sua conta</h1>
        </section>

        <!-- Formulário -->
        <section class="login-area">
            <form class="login-form" th:action="@{/perform_login}" method="post">

                <h2>Entrar</h2>

                <p class="login-erro" th:if="${param.error}" role="alert">E-mail ou senha incorretos.</p>
                <p class="login-info" th:if="${param.logout}">Você saiu da sua conta.</p>

                <label for="username">E-mail</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>

                <label for="password">Senha</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>

                <a class="login-esqueci" href="#">Esqueci minha senha</a>

                <button type="submit" class="login-btn">Entrar</button>

                <p class="login-cadastro">Ainda não tem conta? <a href="#">Criar conta</a></p>

                <a class="login-voltar" th:href="@{/}">Voltar para a loja</a>
            </form>
        </section>

    </main>

</body>
</html>
