<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/berzerk.css(v=11)}">
    <th:block th:replace="~{fragments/fragmentos :: tema}"></th:block>

    <title>Criar conta | Estilo London Store</title>
    <link rel="icon" type="image/png" sizes="256x256" th:href="@{/brand/favicon.png}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="apple-touch-icon" th:href="@{/brand/apple-touch-icon.png}">
</head>

<body>

    <main class="login">

        <!-- Painel escuro com a marca (mesmo do login) -->
        <section class="login-marca">
            <img class="login-marca-fundo" th:src="${site.logoPersonalizada} ? @{'/logo-site/' + ${site.logoArquivo}} : @{/brand/logo-el-branca-hd.png}" alt="" aria-hidden="true">
            <a class="login-logo" th:href="@{/}">Estilo London</a>
            <h1 class="login-titulo">Crie<br>sua conta</h1>
        </section>

        <!-- Formulário -->
        <section class="login-area">
            <form class="login-form" th:action="@{/criar-conta}" method="post" novalidate>

                <h2>Criar conta</h2>

                <p class="login-erro" th:if="${!erros.isEmpty()}" role="alert">Confira os campos destacados abaixo.</p>

                <div class="login-campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" th:value="${nome}" maxlength="80" autocomplete="name" required autofocus
                           th:attr="aria-invalid=${erros.containsKey('nome')}">
                    <p class="campo-erro" th:if="${erros.containsKey('nome')}" th:text="${erros['nome']}" role="alert"></p>
                </div>

                <div class="login-campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" th:value="${email}" maxlength="150" autocomplete="email" required
                           th:attr="aria-invalid=${erros.containsKey('email')}">
                    <p class="campo-erro" th:if="${erros.containsKey('email')}" th:text="${erros['email']}" role="alert"></p>
                </div>

                <div class="login-campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" maxlength="64" autocomplete="new-password" required
                           th:attr="aria-invalid=${erros.containsKey('senha')}">
                    <p class="campo-ajuda" th:unless="${erros.containsKey('senha')}">De 8 a 64 caracteres, com pelo menos uma letra e um número.</p>
                    <p class="campo-erro" th:if="${erros.containsKey('senha')}" th:text="${erros['senha']}" role="alert"></p>
                </div>

                <div class="login-campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" maxlength="64" autocomplete="new-password" required
                           th:attr="aria-invalid=${erros.containsKey('confirmarSenha')}">
                    <p class="campo-erro" th:if="${erros.containsKey('confirmarSenha')}" th:text="${erros['confirmarSenha']}" role="alert"></p>
                </div>

                <button type="submit" class="login-btn">Criar conta</button>

                <p class="login-cadastro">Já tem uma conta? <a th:href="@{/login}">Fazer login</a></p>

                <a class="login-voltar" th:href="@{/}">Voltar para a loja</a>
            </form>
        </section>

    </main>

</body>
</html>
