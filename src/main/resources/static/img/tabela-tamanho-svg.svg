<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #F8F8F8; }
      .card-bg { fill: #FFFFFF; stroke: #E5E5E5; stroke-width: 2; }
      .font-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111111; }
      .font-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #666666; }
      .title { font-size: 38px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
      .subtitle { font-size: 18px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; }
      .th { font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; fill: #FFFFFF; }
      .td-size { font-size: 22px; font-weight: 800; fill: #111111; }
      .td-val { font-size: 22px; font-weight: 500; fill: #222222; }
      .badge-text { font-size: 16px; font-weight: 800; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
      .legend-title { font-size: 18px; font-weight: 700; fill: #111111; }
      .legend-desc { font-size: 15px; font-weight: 400; fill: #555555; }
      .shirt-outline { fill: #F2F2F2; stroke: #111111; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .measure-line { stroke: #111111; stroke-width: 2.5; stroke-dasharray: 6, 4; }
      .row-even { fill: #FFFFFF; }
      .row-odd { fill: #F9F9F9; }
      .table-border { stroke: #E0E0E0; stroke-width: 1.5; }
    </style>

    <!-- Marcadores de seta para as linhas de medida -->
    <marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 1 L 2 5 L 10 9 z" fill="#111111" />
    </marker>
    <marker id="arrow-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#111111" />
    </marker>
  </defs>

  <!-- Fundo Principal (Proporção 1:1 ideal para galerias de e-commerce) -->
  <rect width="1000" height="1000" class="bg" />
  <rect x="40" y="40" width="920" height="920" rx="8" class="card-bg" />

  <!-- Cabeçalho -->
  <text x="500" y="110" text-anchor="middle" class="font-main title">GUIA DE TAMANHOS</text>
  <text x="500" y="145" text-anchor="middle" class="font-muted subtitle">MEDIDAS EM CENTÍMETROS (CM) • MODELAGEM REGULAR</text>
  <line x1="100" y1="175" x2="900" y2="175" stroke="#E5E5E5" stroke-width="2" />

  <!-- SEÇÃO SUPERIOR: Silhueta Técnica + Legenda -->
  <g transform="translate(110, 200)">
    <!-- Silhueta Minimalista da Camiseta -->
    <path d="M 110 25 
             Q 150 48 190 25 
             L 245 45 
             L 295 115 
             L 255 145 
             L 225 105 
             L 225 275 
             L 75 275 
             L 75 105 
             L 45 145 
             L 5 115 
             L 55 45 Z" class="shirt-outline" />
    
    <!-- Detalhe da Gola -->
    <path d="M 110 25 Q 150 58 190 25" fill="none" stroke="#111111" stroke-width="2.5" />

    <!-- Linha de Medida A: Tórax / Largura -->
    <line x1="80" y1="130" x2="220" y2="130" class="measure-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <circle cx="150" cy="130" r="14" fill="#111111" />
    <text x="150" y="130" class="font-main badge-text">A</text>

    <!-- Linha de Medida B: Comprimento -->
    <line x1="115" y1="35" x2="115" y2="270" class="measure-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <circle cx="115" cy="195" r="14" fill="#111111" />
    <text x="115" y="195" class="font-main badge-text">B</text>

    <!-- Linha de Medida C: Manga -->
    <line x1="242" y1="53" x2="287" y2="115" class="measure-line" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <circle cx="276" cy="72" r="14" fill="#111111" />
    <text x="276" y="72" class="font-main badge-text">C</text>

    <!-- Legenda Explicativa (Lado Direito da Silhueta) -->
    <g transform="translate(340, 35)">
      <!-- Item A -->
      <circle cx="16" cy="16" r="15" fill="#111111" />
      <text x="16" y="16" class="font-main badge-text">A</text>
      <text x="45" y="14" class="font-main legend-title">TÓRAX / LARGURA</text>
      <text x="45" y="36" class="font-muted legend-desc">Medida frontal de costura a costura, logo abaixo das axilas.</text>

      <!-- Item B -->
      <g transform="translate(0, 80)">
        <circle cx="16" cy="16" r="15" fill="#111111" />
        <text x="16" y="16" class="font-main badge-text">B</text>
        <text x="45" y="14" class="font-main legend-title">COMPRIMENTO</text>
        <text x="45" y="36" class="font-muted legend-desc">Do ponto mais alto do ombro (junto à gola) até a barra.</text>
      </g>

      <!-- Item C -->
      <g transform="translate(0, 160)">
        <circle cx="16" cy="16" r="15" fill="#111111" />
        <text x="16" y="16" class="font-main badge-text">C</text>
        <text x="45" y="14" class="font-main legend-title">MANGA</text>
        <text x="45" y="36" class="font-muted legend-desc">Da costura superior do ombro até a extremidade da manga.</text>
      </g>
    </g>
  </g>

  <!-- SEÇÃO INFERIOR: Tabela de Medidas -->
  <g transform="translate(80, 515)">
    <!-- Cabeçalho da Tabela -->
    <rect x="0" y="0" width="840" height="56" rx="4" fill="#111111" />
    <text x="105" y="35" text-anchor="middle" class="font-main th">TAMANHO</text>
    <text x="315" y="35" text-anchor="middle" class="font-main th">(A) TÓRAX</text>
    <text x="525" y="35" text-anchor="middle" class="font-main th">(B) COMPRIMENTO</text>
    <text x="735" y="35" text-anchor="middle" class="font-main th">(C) MANGA</text>

    <!-- Linha 1: PP -->
    <rect x="0" y="56" width="840" height="54" class="row-even table-border" />
    <text x="105" y="91" text-anchor="middle" class="font-main td-size">PP</text>
    <text x="315" y="91" text-anchor="middle" class="font-main td-val">50 cm</text>
    <text x="525" y="91" text-anchor="middle" class="font-main td-val">68 cm</text>
    <text x="735" y="91" text-anchor="middle" class="font-main td-val">20 cm</text>

    <!-- Linha 2: P -->
    <rect x="0" y="110" width="840" height="54" class="row-odd table-border" />
    <text x="105" y="145" text-anchor="middle" class="font-main td-size">P</text>
    <text x="315" y="145" text-anchor="middle" class="font-main td-val">52 cm</text>
    <text x="525" y="145" text-anchor="middle" class="font-main td-val">70 cm</text>
    <text x="735" y="145" text-anchor="middle" class="font-main td-val">21 cm</text>

    <!-- Linha 3: M -->
    <rect x="0" y="164" width="840" height="54" class="row-even table-border" />
    <text x="105" y="199" text-anchor="middle" class="font-main td-size">M</text>
    <text x="315" y="199" text-anchor="middle" class="font-main td-val">54 cm</text>
    <text x="525" y="199" text-anchor="middle" class="font-main td-val">73 cm</text>
    <text x="735" y="199" text-anchor="middle" class="font-main td-val">22 cm</text>

    <!-- Linha 4: G -->
    <rect x="0" y="218" width="840" height="54" class="row-odd table-border" />
    <text x="105" y="253" text-anchor="middle" class="font-main td-size">G</text>
    <text x="315" y="253" text-anchor="middle" class="font-main td-val">57 cm</text>
    <text x="525" y="253" text-anchor="middle" class="font-main td-val">76 cm</text>
    <text x="735" y="253" text-anchor="middle" class="font-main td-val">23 cm</text>

    <!-- Linha 5: GG -->
    <rect x="0" y="272" width="840" height="54" class="row-even table-border" />
    <text x="105" y="307" text-anchor="middle" class="font-main td-size">GG</text>
    <text x="315" y="307" text-anchor="middle" class="font-main td-val">60 cm</text>
    <text x="525" y="307" text-anchor="middle" class="font-main td-val">79 cm</text>
    <text x="735" y="307" text-anchor="middle" class="font-main td-val">24 cm</text>

    <!-- Linha 6: XGG -->
    <rect x="0" y="326" width="840" height="54" class="row-odd table-border" />
    <text x="105" y="361" text-anchor="middle" class="font-main td-size">XGG</text>
    <text x="315" y="361" text-anchor="middle" class="font-main td-val">63 cm</text>
    <text x="525" y="361" text-anchor="middle" class="font-main td-val">82 cm</text>
    <text x="735" y="361" text-anchor="middle" class="font-main td-val">25 cm</text>

    <!-- Linhas Verticais Divisórias da Tabela -->
    <line x1="210" y1="56" x2="210" y2="380" class="table-border" />
    <line x1="420" y1="56" x2="420" y2="380" class="table-border" />
    <line x1="630" y1="56" x2="630" y2="380" class="table-border" />
  </g>

  <!-- Nota de Rodapé -->
  <text x="500" y="932" text-anchor="middle" class="font-muted" style="font-size: 14px;">
    * As medidas podem apresentar variação de até 1,5 cm devido ao processo de costura e lavagem.
  </text>
</svg>