# Perfil de produção: PostgreSQL persistente. Configure DB_HOST, DB_PORT, DB_NAME,
# DB_USERNAME e DB_PASSWORD no ambiente de execução (nunca grave credenciais no repositório).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nazomocambique}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema deve estar previamente criado e versionado antes de habilitar este perfil.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Console H2 nunca deve ficar exposto em produção.
spring.h2.console.enabled=false

# Limites de upload mantidos.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
