# Perfil para demonstração no Render (plano gratuito): H2 em memória, recriado a cada início
# com o data.sql (produtos, admin e cliente de teste). Os pedidos NÃO sobrevivem a reinícios
# nem à hibernação do serviço. Ative com SPRING_PROFILES_ACTIVE=render.
spring.datasource.url=jdbc:h2:mem:nmb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 desligado: o serviço fica público na internet.
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Memória curta do plano gratuito
server.tomcat.threads.max=40
