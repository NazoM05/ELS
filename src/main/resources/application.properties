spring.application.name=nazomocambique

# Basic in-memory H2 configuration
spring.datasource.url=jdbc:h2:mem:nmb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enables the H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Garante a ordem: 1Âº Hibernate cria as tabelas -> 2Âº Roda o data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Upload de imagens (frente e costas): o padrão do Spring é 1MB por arquivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------
# Correios (cotação de frete). Desligado por padrão: sem contrato, a loja usa o frete fixo
# + prazo por estado. Para ligar, defina as variáveis de ambiente (não grave senha aqui).
# O código de acesso é gerado em cws.correios.com.br > Gestão de acesso a APIs.
# ---------------------------------------------------------------------
correios.enabled=${CORREIOS_ENABLED:false}
correios.base-url=${CORREIOS_BASE_URL:https://api.correios.com.br}
correios.usuario=${CORREIOS_USUARIO:}
correios.codigo-acesso=${CORREIOS_CODIGO_ACESSO:}
correios.cartao-postagem=${CORREIOS_CARTAO_POSTAGEM:}
correios.cep-origem=${CORREIOS_CEP_ORIGEM:}
correios.servicos=${CORREIOS_SERVICOS:03298,03220}
correios.timeout=${CORREIOS_TIMEOUT:4s}

# ---------------------------------------------------------------------
# Mercado Pago (pagamento por Pix). Desligado por padrao: sem credenciais, o pedido fica "Aguardando
# pagamento" e a equipe confirma a mao. Defina as variaveis de ambiente (nunca grave a chave aqui).
# Access Token e assinatura secreta: painel de desenvolvedores do Mercado Pago > sua aplicacao.
# ---------------------------------------------------------------------
mercadopago.enabled=${MERCADOPAGO_ENABLED:false}
mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:}
mercadopago.pix-expiracao-minutos=${MERCADOPAGO_PIX_EXPIRACAO_MINUTOS:60}
mercadopago.timeout=${MERCADOPAGO_TIMEOUT:8s}
