spring.application.name=nazomocambique

# Segredos locais (opcional): se o arquivo existir, sobrescreve as chaves abaixo. Fica fora do Git.
spring.config.import=optional:classpath:secrets-local.properties

# Desenvolvimento local: mantém os dados do H2 entre reinícios. Produção usa o perfil prod.
spring.profiles.default=dev

# Compressão HTTP para reduzir o tráfego de HTML/CSS/JS/JSON.
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# Porta do servidor: defina a variavel PORT para trocar (ex.: PORT=8081)
server.port=${PORT:8080}

# A URL do banco é definida pelo perfil ativo (dev ou prod).
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enables the H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Garante a ordem: 1º Hibernate cria as tabelas -> 2º Roda o data.sql
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Upload de imagens (frente e costas): o padrão do Spring é 1MB por arquivo
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ---------------------------------------------------------------------
# Correios (cotação de frete). Desligado por padrão: sem contrato, a loja usa o frete fixo
# + prazo por estado. Para ligar, defina as variáveis de ambiente (não grave senha aqui).
# O código de acesso é gerado em cws.correios.com.br > Gestão de acesso a APIs.
# ---------------------------------------------------------------------
correios.enabled=${CORREIOS_ENABLED:false}
correios.base-url=${CORREIOS_BASE_URL:https://api.correios.com.br}
correios.usuario=${CORREIOS_USUARIO:}
correios.codigo-acesso=${CORREIOS_CODIGO_ACESSO:}
correios.cartao-postagem=${CORREIOS_CARTAO_POSTAGEM:}
correios.cep-origem=${CORREIOS_CEP_ORIGEM:}
correios.servicos=${CORREIOS_SERVICOS:03298,03220}
correios.timeout=${CORREIOS_TIMEOUT:4s}

# ---------------------------------------------------------------------
# Asaas (Pix dinâmico) - Sandbox para demonstração acadêmica.
# A chave e o token ficam em variáveis de ambiente (Render) ou no secrets-local.properties (só local, fora do Git).
# Este arquivo não guarda mais segredos.
# ---------------------------------------------------------------------
asaas.enabled=${ASAAS_ENABLED:true}
asaas.base-url=${ASAAS_BASE_URL:https://api-sandbox.asaas.com/v3}
asaas.api-key=${KEY_ASAAS:}
asaas.webhook-token=${ASAAS_WEBHOOK_TOKEN:}
asaas.pix-expiracao-minutos=${ASAAS_PIX_EXPIRACAO_MINUTOS:60}
asaas.timeout=${ASAAS_TIMEOUT:10s}


# ---------------------------------------------------------------------
# Etiqueta de envio dos Correios (pré-postagem). Só funciona com correios.enabled=true, as credenciais acima e o
# remetente abaixo completo. O CEP do remetente é o correios.cep-origem. Nada de código de rastreio é inventado:
# ele vem da resposta dos Correios.
# ---------------------------------------------------------------------
correios.remetente.nome=${CORREIOS_REMETENTE_NOME:}
correios.remetente.cpf-cnpj=${CORREIOS_REMETENTE_CPF_CNPJ:}
correios.remetente.telefone=${CORREIOS_REMETENTE_TELEFONE:}
correios.remetente.email=${CORREIOS_REMETENTE_EMAIL:}
correios.remetente.logradouro=${CORREIOS_REMETENTE_LOGRADOURO:}
correios.remetente.numero=${CORREIOS_REMETENTE_NUMERO:}
correios.remetente.complemento=${CORREIOS_REMETENTE_COMPLEMENTO:}
correios.remetente.bairro=${CORREIOS_REMETENTE_BAIRRO:}
correios.remetente.cidade=${CORREIOS_REMETENTE_CIDADE:}
correios.remetente.uf=${CORREIOS_REMETENTE_UF:}


# E-mail SMTP para recuperação de senha (credenciais fornecidas via variáveis de ambiente).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
